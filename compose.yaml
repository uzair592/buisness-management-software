services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bms_local
      POSTGRES_PASSWORD: bms_local
      POSTGRES_DB: bms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms_local -d bms"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
