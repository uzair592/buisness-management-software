name: Foundation checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bms_local
          POSTGRES_PASSWORD: bms_local
          POSTGRES_DB: bms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bms_local -d bms"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://bms_local:bms_local@127.0.0.1:5432/bms
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check
      - run: pnpm test:db
      - run: pnpm test:runtime
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-browser-evidence
          path: docs/evidence/m01/*.png
